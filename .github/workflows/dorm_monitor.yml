name: StwDO Dorm Monitor

# ─────────────────────────────────────────────────────────────────────────────
# Triggers:
#   1. Scheduled cron – fires at 09:55 Berlin time on Mondays and Wednesdays
#      (GitHub Actions runs in UTC; Berlin is UTC+1 in winter / UTC+2 in summer)
#      09:55 CET = 08:55 UTC
#      55 8 * * 1,3
#   2. workflow_dispatch – manual trigger from GitHub Actions UI anytime
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # 09:55 CET (UTC+1) = 08:55 UTC on Mondays and Wednesdays
    - cron: "55 8 * * 1,3"
  workflow_dispatch:
    inputs:
      headless:
        description: "Run browser in headless mode? (true/false)"
        required: false
        default: "true"
      max_runtime_minutes:
        description: "Override MAX_RUNTIME_MINUTES (minutes)"
        required: false
        default: "90"
      polling_interval_seconds:
        description: "Override POLLING_INTERVAL_SECONDS (seconds)"
        required: false
        default: "30"

# Cancel any in-progress run if a new one is triggered
concurrency:
  group: stwdo-monitor
  cancel-in-progress: true

jobs:
  monitor:
    name: Monitor StwDO Listings
    runs-on: ubuntu-latest
    timeout-minutes: 110   # hard cap – slightly above MAX_RUNTIME_MINUTES

    steps:
      # ── 1. Checkout repository ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python 3.11 ──────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Install Python dependencies ─────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Install Playwright system-level Chromium browser + deps ──────────
      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps chromium

      # ── 5. Run the monitoring bot ──────────────────────────────────────────
      - name: Run StwDO Dorm Monitor
        env:
          # Applicant personal data (GitHub Secrets with fallback defaults so it NEVER crashes)
          APPLICANT_FIRST_NAME:     ${{ secrets.APPLICANT_FIRST_NAME || 'Ahmed' }}
          APPLICANT_LAST_NAME:      ${{ secrets.APPLICANT_LAST_NAME || 'Rasheed' }}
          APPLICANT_EMAIL:          ${{ secrets.APPLICANT_EMAIL || 'ahmed.rasheed@tu-dortmund.de' }}
          APPLICANT_PHONE:          ${{ secrets.APPLICANT_PHONE || '+3089876647' }}
          APPLICANT_MATRIKEL:       ${{ secrets.APPLICANT_MATRIKEL || '285351' }}

          # Push alert channels (ntfy.sh push alert straight to phone)
          NTFY_TOPIC:               ${{ secrets.NTFY_TOPIC || 'ahmed-dorm-285351' }}
          NTFY_SERVER:              ${{ secrets.NTFY_SERVER || 'https://ntfy.sh' }}

          # Telegram credentials (optional)
          TELEGRAM_BOT_TOKEN:       ${{ secrets.TELEGRAM_BOT_TOKEN || '' }}
          TELEGRAM_CHAT_ID:         ${{ secrets.TELEGRAM_CHAT_ID || '' }}

          # Discord / Email (optional)
          DISCORD_WEBHOOK:          ${{ secrets.DISCORD_WEBHOOK || '' }}
          ALERT_EMAIL_FROM:         ${{ secrets.ALERT_EMAIL_FROM || '' }}
          ALERT_EMAIL_TO:           ${{ secrets.ALERT_EMAIL_TO || '' }}
          ALERT_EMAIL_PASS:         ${{ secrets.ALERT_EMAIL_PASS || '' }}

          # Runtime configuration
          LISTINGS_URL:             "https://www.stwdo.de/wohnen/aktuelle-wohnangebote"
          HEADLESS:                 ${{ github.event.inputs.headless || 'true' }}
          MAX_RUNTIME_MINUTES:      ${{ github.event.inputs.max_runtime_minutes || '90' }}
          POLLING_INTERVAL_SECONDS:  ${{ github.event.inputs.polling_interval_seconds || '30' }}
          MIN_ACTION_DELAY_MS:      "300"
          MAX_ACTION_DELAY_MS:      "1200"

        run: python dorm_agent.py

      # ── 6. Upload logs and artifacts on failure ─────────────────────────────
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-artifacts-${{ github.run_id }}
          path: |
            *.log
            *.png
          if-no-files-found: ignore
          retention-days: 7